module: 2
course: learn_unix_git
assets:
- id: learning_path
  type: diagram
  file: assets/diagrams/learning_path.png
  source: assets/diagrams/learning_path.mmd
  generator: render_diagrams.sh
  slides:
  - 4
  license: learn_unix_git course materials
- id: module_check
  type: screenshot
  file: assets/screenshots/module_check.png
  capture_command: ./scripts/module2.sh --check
  cwd: .
  slides:
  - 7
  expect_stdout_contains: All required checks passed
- id: permissions_ls
  type: screenshot
  file: assets/screenshots/permissions_ls.png
  capture_command: cd module2/examples/permissions && ls -l hello.sh config.txt
  cwd: .
  slides:
  - 9
  expect_stdout_contains: hello.sh
- id: which_tools
  type: screenshot
  file: assets/screenshots/which_tools.png
  capture_command: which bash && which git
  cwd: .
  slides:
  - 10
  expect_stdout_contains: bash
